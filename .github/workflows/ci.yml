name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Using `npm install` (not `npm ci`) until a package-lock.json is committed —
      # switch to `npm ci` + `cache: npm` above once that lockfile exists (see README.md).
      - run: npm install
      - run: npm run lint
      - run: npm run test
