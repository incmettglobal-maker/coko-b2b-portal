name: Supabase keepalive (free-tier pause prevention)

# Supabase pauses a free-tier project after 7 days with no database activity.
# This pings the DB every 3 days — safely under that limit — so the portal doesn't
# go cold between a new dealer's logins during early, low-traffic launch.
# Delete this workflow once the project is upgraded to Supabase Pro (paid projects
# are never auto-paused, so this becomes a no-op you don't need).

on:
  schedule:
    - cron: "0 3 */3 * *" # every 3rd day, 03:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -sS -o /dev/null -w "%{http_code}\n" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
